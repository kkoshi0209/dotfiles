# 各設定の理由は dotfiles/docs/settings.md「herdr/config.toml」を参照
onboarding = false

[keys]
previous_agent = "prefix+alt+p"
next_agent = "prefix+alt+n"
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"
last_pane = "prefix+tab"
open_worktree = "prefix+alt+g"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "system"
delay_seconds = 1

[experimental]
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
cjk_ime_cursor_shape = "steady_block"
pane_history = true

[advanced]
scrollback_limit_bytes = 40000000
